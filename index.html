<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sentiment Analysis</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 40px 50px;
            width: 420px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            color: #ffffff;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 28px;
            font-weight: 600;
        }

        p {
            font-size: 14px;
            color: #e0e0e0;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border-radius: 10px;
            border: none;
            outline: none;
            resize: none;
            font-size: 14px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.9);
        }

        button {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            color: #ffffff;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255, 117, 140, 0.5);
        }

        .result {
            margin-top: 25px;
            font-size: 20px;
            font-weight: 500;
        }

        footer {
            margin-top: 20px;
            font-size: 12px;
            color: #dddddd;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Sentiment Analysis</h1>
        <p>Analyze your review and know if it is Positive or Negative</p>

        <form method="POST">
            <textarea name="review" placeholder="Type your review here..." required></textarea>
            <br>
            <button type="submit">Analyze</button>
        </form>

        {% if result %}
            <div class="result">{{ result }}</div>
        {% endif %}

        <footer>
            Built by Sathwika Nelluri 💙
        </footer>
    </div>

</body>
</html>
